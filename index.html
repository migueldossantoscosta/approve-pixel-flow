    <link rel="icon" href="%BASE_URL%favicon.ico" type="image/x-icon" />
    <script>
      // GitHub Pages has no server-side rewrites, so deep links 404 on refresh.
      // public/404.html redirects here with the intended path encoded in the
      // query string; decode it back into the real URL before the router mounts.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, "", redirect);
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
